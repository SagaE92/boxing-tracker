# Build MCUboot alongside the app (west build --sysbuild).
SB_CONFIG_BOOTLOADER_MCUBOOT=y
# Swap using move: test-then-confirm upgrades with revert.
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y
# Prototype key! Replace with your own: imgtool keygen -k boxtrk.pem -t ecdsa-p256
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
