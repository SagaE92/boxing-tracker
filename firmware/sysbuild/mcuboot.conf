# MCUboot image tweaks for the XIAO (chained after the Adafruit UF2 bootloader)
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_USB_DEVICE_STACK=n
# Emit mcuboot as UF2 so it can be dropped onto the XIAO's UF2 drive (no SWD needed)
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_USE_DT_CODE_PARTITION=y
